apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: python-service }
  template:
    metadata:
      labels: { app: python-service }
    spec:
      containers:
        - name: python-service
          image: python-service   # replaced by kustomize (see kustomization.yaml)
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: demo
spec:
  selector: { app: python-service }
  ports:
    - port: 5000
      targetPort: 5000

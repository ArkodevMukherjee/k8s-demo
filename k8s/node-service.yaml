apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: node-service }
  template:
    metadata:
      labels: { app: node-service }
    spec:
      containers:
        - name: node-service
          image: node-service   # replaced by kustomize (see kustomization.yaml)
          ports:
            - containerPort: 3000
          env:
            - name: PYTHON_SERVICE_URL
              value: http://python-service:5000   # in-cluster DNS
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: demo
spec:
  selector: { app: node-service }
  ports:
    - port: 80
      targetPort: 3000
